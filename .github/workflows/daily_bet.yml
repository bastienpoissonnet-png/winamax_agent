name: Daily Winamax Value Betting Analysis

on:
  schedule:
    # Déclenchement automatique tous les jours à 10h00 UTC (12h00 heure de Paris)
    - cron: '0 10 * * *'
  workflow_dispatch: # Déclenchement manuel à la demande depuis l'interface GitHub

jobs:
  run-daily-analysis:
    name: Scan des Marchés & Envoi Discord
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎯 Exécution du moteur d'analyse & Notification Discord
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BOOKMAKER: winamax
          SIMULATION_MODE: false
          OUTPUT_DIR: reports
        run: |
          python -m winamax_agent.cli --run-once

      - name: 💾 Commit et push des mises à jour de reports/bankroll.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/bankroll.json
          if git diff --staged --quiet; then
            echo "Aucune modification de la bankroll à enregistrer."
          else
            git commit -m "chore: mise à jour automatique de la bankroll [skip ci]"
            git push
          fi

      - name: 📁 Sauvegarde des rapports générés (Artifacts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-betting-reports-${{ github.run_number }}
          path: reports/
          retention-days: 7

